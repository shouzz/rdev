<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>接入远程调试</title>
  <style>
    :root { color-scheme: light; --ink:#18201d; --muted:#64706a; --line:#d7ded9; --surface:#f5f7f5; --green:#177245; --cyan:#08798a; --danger:#a32929; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#fff; color:var(--ink); font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif; }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:clamp(36px,8vh,84px) 0 48px; }
    h1 { margin:0; font-size:clamp(28px,5vw,44px); font-weight:680; }
    .lead { margin:10px 0 30px; color:var(--muted); font-size:15px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 0; border-top:1px solid var(--line); }
    .label { min-width:110px; font-weight:620; }
    button { min-height:40px; border:1px solid var(--line); border-radius:6px; padding:0 14px; background:#fff; color:var(--ink); font:inherit; cursor:pointer; }
    button:hover { border-color:#8d9a93; background:var(--surface); }
    .segments { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4px; padding:4px; background:var(--surface); border:1px solid var(--line); border-radius:7px; }
    .segments button { border:0; background:transparent; }
    .segments button.active { color:#fff; background:var(--green); }
    .command { margin-top:22px; }
    pre { min-height:112px; margin:10px 0 12px; padding:16px; border:1px solid var(--line); border-radius:7px; background:#111815; color:#e9f2ed; white-space:pre-wrap; overflow-wrap:anywhere; font:13px/1.65 "Cascadia Code",Consolas,monospace; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .primary { border-color:var(--cyan); background:var(--cyan); color:#fff; }
    .primary:hover { border-color:#076876; background:#076876; }
    .status { min-height:22px; margin-top:16px; color:var(--green); font-size:14px; }
    .invalid { color:var(--danger); }
    @media (max-width:580px) { main { width:min(100% - 24px,760px); padding-top:28px; } .row { align-items:flex-start; flex-direction:column; } .segments { width:100%; } }
  </style>
</head>
<body>
<main>
  <h1>接入远程调试</h1>
  <p class="lead" id="lead">复制下面这一行，在目标电脑运行。</p>
  <div class="row">
    <div class="label">目标系统</div>
    <div class="segments" role="tablist" aria-label="目标电脑系统">
      <button type="button" class="active" data-os="windows">Windows</button>
      <button type="button" data-os="linux">Linux</button>
    </div>
  </div>
  <section class="command">
    <p id="windowsRequirements">Windows 7 及以上可直接运行，自动安装并保持连接。</p>
    <div class="label">接入命令</div>
    <pre id="command"></pre>
    <div class="actions"><button type="button" class="primary" id="copyCommand">复制接入命令</button></div>
    <div class="status" id="status" role="status"></div>
  </section>
</main>
<script>
(() => {
  const internalConfig = location.hash.startsWith('#') ? location.hash.slice(1) : '';
  history.replaceState(null, '', location.pathname);
  const state = { os: 'windows' };
  const commandNode = document.getElementById('command');
  const statusNode = document.getElementById('status');
  const valid = /^rdeve_[A-Za-z0-9_-]{43}$/.test(internalConfig);
  if (!valid) {
    document.getElementById('lead').textContent = '接入链接无效，请从控制台重新复制命令。';
    document.getElementById('lead').classList.add('invalid');
  }
  function render() {
    if (!valid) { commandNode.textContent = ''; return; }
    const origin = location.origin;
    document.getElementById('windowsRequirements').hidden = state.os !== 'windows';
    if (state.os === 'windows') {
      const hashPattern = 'c9f9d19de355cf86b1858d31fe678d038158c3c7932a409981bf1c132a669c44'.match(/../g).join('.*');
      const download = 'certutil -urlcache -split -f ' + origin + '/run.cmd rdev-run.cmd';
      const bootstrap = origin === 'https://r.feidu.fit' ? '(' + download + ' >nul 2>&1 || certutil -urlcache -split -f http://r.feidu.fit:18080/run.cmd rdev-run.cmd)' : download;
      commandNode.textContent = 'cmd.exe /d /s /c "cd /d %TEMP% && set RDEV_ENROLLMENT_CODE=' + internalConfig + '&& ' + bootstrap + ' && (certutil -hashfile rdev-run.cmd SHA256 | findstr /i /r /x ' + hashPattern + ' >nul) && call rdev-run.cmd -Server ' + origin + ' -Enroll -Persist"';
    } else {
      commandNode.textContent = 'tmp="$(mktemp)"; trap ' + String.fromCharCode(39) + 'rm -f "$tmp"' + String.fromCharCode(39) + ' EXIT; curl --fail --show-error --location --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 120 --output "$tmp" ' + String.fromCharCode(39) + origin + '/run.sh' + String.fromCharCode(39) + '; test -s "$tmp"; RDEV_ENROLLMENT_CODE=' + String.fromCharCode(39) + internalConfig + String.fromCharCode(39) + ' sh "$tmp" ' + String.fromCharCode(39) + origin + String.fromCharCode(39) + ' --persist';
    }
  }
  document.querySelectorAll('[data-os]').forEach(button => button.addEventListener('click', () => {
    state.os = button.dataset.os;
    document.querySelectorAll('[data-os]').forEach(item => item.classList.toggle('active', item === button));
    render();
  }));
  async function copy(value, message) {
    if (!value) return;
    await navigator.clipboard.writeText(value);
    statusNode.textContent = message;
    setTimeout(() => { statusNode.textContent = ''; }, 1800);
  }
  document.getElementById('copyCommand').addEventListener('click', () => copy(commandNode.textContent, '接入命令已复制'));
  render();
})();
</script>
</body>
</html>
